# Configuration for Thermal-Aware Qubit Mapping Study
experiment:
  shots: 8192
  seeds:
    transpiler: 42
    simulator: 42
    random_mapper: 12345
  random_layouts_count: 50
  budget_cap_qpu_seconds: 350
  reserve_qpu_seconds: 250
  thermal_term_mode: raw_upper_bound
  qubit_region: [0, 1, 2, 3, 4]

backends:
  fake_5q: "fake_vigo"
  fake_16q: "fake_guadalupe"
  backend_selection:
    min_num_qubits: 127
    simulator: false
    operational: true

thermal:
  # Synthetic temperature profile (in millikelvin)
  default_temp_mK: 15.0
