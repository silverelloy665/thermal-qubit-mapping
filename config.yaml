# Configuration for Thermal-Aware Qubit Mapping Study
experiment:
  shots: 8192
  seeds:
    transpiler: 42
    simulator: 42
    random_mapper: 12345
  random_layouts_count: 50
  budget_cap_qpu_seconds: 350
  reserve_qpu_seconds: 250
  thermal_term_mode: excess_over_readout
  qubit_region: all

backend: ibm_marrakesh

backends:
  backend: ibm_marrakesh
  fake_5q: "fake_vigo"
  fake_16q: "fake_guadalupe"
  backend_selection:
    min_num_qubits: 127
    simulator: false
    operational: true

thermal:
  # Synthetic temperature profile (in millikelvin)
  default_temp_mK: 15.0

# Hardware Extra Experiment Configuration (Checkpoint Q)
extra_backend: ibm_marrakesh     # fallback ibm_fez, fail if not in live list
allowance_remaining_s: 279       # manual, dashboard 11 Oct 2026, 4m39s remain
allowance_checked_at: "2026-10-16T00:15:00+05:30"  # manual entry verification timestamp
reserve_s: 150                   # must stay unspent
extra_run_cap_s: 110             # main run cap (estimate 3.0 s/circuit is conservative, measured 2.3 s earlier)
hot_min_excess: 0.05
max_regions: 3
benchmarks_extra: [ghz, bv, mirror]
shots: 8192
repetitions: 2
region_distance: 4               # d<=2 has no clean 5q subgraphs on heavy-hex (girth 6); d<=4 provides connected clean subgraphs

